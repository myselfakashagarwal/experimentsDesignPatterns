services:
  app:
    image: eclipse-temurin:17-jre
    container_name: design-patterns-demo
    ports:
      - "8080:8081"
    volumes:
      - ./core/target/core-0.0.1-SNAPSHOT.jar:/app/app.jar
    working_dir: /app
    command: ["java", "-jar", "app.jar"]
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=dev
    restart: unless-stopped
